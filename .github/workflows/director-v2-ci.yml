name: Director Workspace v2.1 CI

on:
  push:
    branches:
      - agent/director-workspace-v2-1
    paths:
      - "visual-direction-os/**"
      - ".github/workflows/director-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run model behavior tests
        run: |
          node visual-direction-os/director-v2-models.test.js
          node visual-direction-os/visual-qa.test.js
          node visual-direction-os/site-publish.test.js
      - name: Check JavaScript syntax
        run: |
          node --check visual-direction-os/scene-state.js
          node --check visual-direction-os/director-v2-app.js
          node --check visual-direction-os/state-machine.js
          node --check visual-direction-os/sequence-score.js
          node --check visual-direction-os/color-ownership.js
          node --check visual-direction-os/diagnostic.js
          node --check visual-direction-os/timeline-sync.js
          node --check visual-direction-os/visual-qa.js
          node --check visual-direction-os/build-pages-site.js
      - name: Run staging source QA
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const qa = require('./visual-direction-os/visual-qa.js');
          const html = fs.readFileSync('./visual-direction-os/director-v2.html','utf8');
          const css = fs.readFileSync('./visual-direction-os/director-v2.css','utf8') + '\n' + fs.readFileSync('./visual-direction-os/director-v2-tools.css','utf8');
          const findings = qa.scanSource({html, css});
          findings.forEach(f => console.log(`${f.level} ${f.id}: ${f.message} ${f.detail || ''}`));
          if (findings.some(f => f.level === 'FAIL')) process.exit(1);
          NODE
      - name: Check staging contracts
        run: |
          test -f visual-direction-os/director-v2.html
          test -f visual-direction-os/director-v2.css
          test -f visual-direction-os/director-v2-tools.css
          ! grep -R "transition:[[:space:]]*all" visual-direction-os/director-v2*.css
          grep -q "prefers-reduced-motion" visual-direction-os/director-v2.css
          grep -q "prefers-reduced-motion" visual-direction-os/director-v2-tools.css
      - name: Verify assembled Pages site
        run: |
          node visual-direction-os/build-pages-site.js visual-direction-os /tmp/vdos-site
          cmp visual-direction-os/director-v2.html /tmp/vdos-site/index.html
          cmp visual-direction-os/index.html /tmp/vdos-site/knowledge.html
          test -f /tmp/vdos-site/director-v2-app.js
          test -f /tmp/vdos-site/scene-state.js
      - name: Run browser acceptance
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory visual-direction-os >/tmp/vdos-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          npx playwright test visual-direction-os/director-v2-browser.spec.js --reporter=line --workers=1
