name: Director Workspace v2.1 CI

on:
  push:
    branches:
      - agent/director-workspace-v2-1
    paths:
      - "visual-direction-os/**"
      - ".github/workflows/director-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run model behavior tests
        run: node visual-direction-os/director-v2-models.test.js
      - name: Check JavaScript syntax
        run: |
          node --check visual-direction-os/scene-state.js
          node --check visual-direction-os/director-v2-app.js
          node --check visual-direction-os/state-machine.js
          node --check visual-direction-os/sequence-score.js
          node --check visual-direction-os/color-ownership.js
          node --check visual-direction-os/diagnostic.js
      - name: Check staging contracts
        run: |
          test -f visual-direction-os/director-v2.html
          test -f visual-direction-os/director-v2.css
          test -f visual-direction-os/director-v2-tools.css
          ! grep -R "transition:[[:space:]]*all" visual-direction-os/director-v2*.css
          grep -q "prefers-reduced-motion" visual-direction-os/director-v2.css
          grep -q "prefers-reduced-motion" visual-direction-os/director-v2-tools.css
